<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C0D11"><title>星幕 · 随身放映厅</title><link rel="stylesheet" href="/tv/tv.css"><link rel="stylesheet" href="/mobile/tokens.css"><link rel="stylesheet" href="/mobile/mobile.css?v=12013"></head>
<body>
<header><button id="mobile-page-back" class="icon-btn" aria-label="返回上一页" data-icon="back"></button><div class="brand"><span data-icon="star"></span><b>星幕</b></div><button id="source-count" aria-live="polite" aria-label="查看本地片库状态">正在连接片库…</button></header>
<div id="mobile-network" class="banner" hidden>网络连接已断开。可以浏览已缓存片单，搜索与播放需要联网。</div>
<section id="mobile-continue" aria-label="继续观看" hidden></section>
<nav id="nav" aria-label="影片分类"></nav>
<div id="mobile-ranking"><div><h2>电影片单</h2><p>从喜欢的故事开始</p></div><div class="seg"><button data-tab="豆瓣推荐">豆瓣</button><button data-tab="烂番茄">烂番茄</button></div></div>
<main id="content"></main>
<footer id="mobile-nav" aria-label="主导航"><button data-tab="电影"><span data-icon="film"></span><span>发现</span></button><button data-tab="直播"><span data-icon="live"></span><span>直播</span></button><button data-tab="继续看"><span data-icon="clock"></span><span>记录</span></button><button data-tab="搜索" id="mobile-search"><span data-icon="search"></span><span>搜索</span></button></footer>
<div id="mobile-cta" hidden><button id="mobile-start" class="cta">开始播放</button></div>
<section id="player" hidden aria-label="播放器"><video id="video" playsinline></video><div id="play-title"></div><div id="play-message" role="status"></div><div id="play-hint"></div><div id="progress"><i></i></div>
<div class="mobile-player-top"><button id="mobile-back" class="icon-btn" aria-label="返回选集或频道" data-icon="back"></button><button id="mobile-orientation" aria-label="切换横屏或竖屏">横屏</button><button id="mobile-fullscreen" class="icon-btn" aria-label="全屏" data-icon="full"></button></div>
<div id="mobile-controls"><div id="mobile-transport"><button id="mobile-prev" class="round" aria-label="快退10秒"></button><button id="mobile-play" class="round big" aria-label="播放"></button><button id="mobile-next" class="round" aria-label="快进10秒"></button></div>
<div class="mobile-bottom"><div class="mobile-timeline"><span id="mobile-position">00:00</span><input id="mobile-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度"><span id="mobile-duration">00:00</span></div><div class="mobile-actions"><span id="mobile-gesture">左侧上下滑调亮度 · 右侧上下滑调音量</span><button id="mobile-settings">播放设置</button><button id="mobile-route" hidden>换线路</button></div></div></div>
<aside id="mobile-panel" hidden aria-label="播放设置"><div class="panel-head"><b>播放设置</b><button id="mobile-panel-close" class="icon-btn" aria-label="关闭播放设置" data-icon="x"></button></div><label id="mobile-rate-label">播放速度<select id="mobile-rate" aria-label="播放速度"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label id="mobile-orientation-label">屏幕方向<select id="mobile-orientation-mode"><option value="auto">跟随系统</option><option value="landscape">锁定横屏</option><option value="portrait">锁定竖屏</option></select></label><section class="mobile-av-settings" aria-label="画面与声音"><label for="mobile-brightness">窗口亮度 <output id="mobile-brightness-value">跟随系统</output></label><input id="mobile-brightness" type="range" min="5" max="100" value="50" aria-label="窗口亮度"><button id="mobile-brightness-auto">亮度跟随系统</button><label for="mobile-volume">媒体音量 <output id="mobile-volume-value"></output></label><input id="mobile-volume" type="range" min="0" max="100" value="50" aria-label="媒体音量"><label for="mobile-quality">播放清晰度</label><select id="mobile-quality"></select><p id="mobile-quality-info" class="subtitle"></p><button id="mobile-report-ad"></button></section><section id="mobile-ad-options"><label for="mobile-ad-mode">智能广告识别（实验）</label><select id="mobile-ad-mode"><option value="off">关闭</option><option value="mask">识别并遮挡小广告</option><option value="auto">遮挡 + 自动跳过纯广告画面</option></select><p id="mobile-ad-status" class="subtitle"></p><p class="subtitle">本机识别，不上传画面。自动跳过每次 3 秒、每次播放最多 18 秒，可撤销；可能漏识别或误判。</p><button id="mobile-mask-draw" class="source-choice">手动框选小广告</button><button id="mobile-mask-clear" class="source-choice">清除所有遮挡</button></section><div id="mobile-panel-content"></div></aside>
<div id="mobile-ad-masks"></div><div id="mobile-ad-notice" hidden><span></span><button id="mobile-ad-undo" hidden>撤销跳过</button><button id="mobile-ad-dismiss">收起</button></div><div id="mobile-mask-select" hidden><p>拖动框住小广告 · <button id="mobile-mask-cancel">取消</button></p><div id="mobile-mask-draft" hidden></div></div>
</section>
<script src="/tv/tv-polyfills.js"></script><script src="/tv/hls.js"></script><script src="/mobile/icons.js"></script><script src="/mobile/app.js?v=12013"></script><script src="/mobile/mobile.js?v=12013"></script>
<script src="/mobile/ad-policy.js?v=12013"></script><script src="/mobile/ad-scanner.js?v=12013"></script>
<script src="/mobile/player-settings.js?v=12013"></script>
<script src="/mobile/fullscreen.js?v=12013"></script><script src="/mobile/gestures.js?v=12013"></script></body></html>
