<title>星幕手机版原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：原型舞台 = 顶部切换条 + 设备框 + 本屏要点。
   设备内 = #content 滚动层 + #nav 浮动底栏（详情/播放器隐藏底栏）。
   视觉方向「放映厅」：墨黑幕布 + 放映灯琥珀，只给主操作、进度、当前态用琥珀。 */
:root{
  color-scheme:dark;
  /* 颜色 */
  --bg:#0C0D11;        /* 幕布：页面底色 */
  --s1:#15161C;        /* 一级面：底栏、面板 */
  --s2:#1D1F26;        /* 二级面：芯片、行、卡片 */
  --s3:#292B33;        /* 三级面：按下、频道台标块 */
  --line:rgba(240,232,214,.09);
  --t1:#F2EEE5;        /* 银幕白：标题、正文 */
  --t2:#B7B1A6;        /* 次要文字 */
  --t3:#857E73;        /* 说明、元信息 */
  --amber:#F2B457;     /* 放映灯：主操作/当前态/进度 */
  --amber-ink:#24190A; /* 琥珀上的文字 */
  --amber-soft:rgba(242,180,87,.14);
  --live:#FF5A4E;      /* 直播红点（语义色，不作强调色） */
  --ok:#62D29B;        /* 测速最快、来源正常 */
  --warn:#FF9B5E;      /* 缓存陈旧、部分失败 */
  --bad:#FF6B6B;       /* 超时、断流 */
  /* 字体：WebView 直接用系统中文字体，不加载网络字体 */
  --f-ui:"MiSans","HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --fs-cap:12px; --fs-sm:13px; --fs-body:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:26px;
  /* 间距 4 基数 */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px; --sp8:32px;
  /* 圆角 */
  --r-badge:6px; --r-poster:10px; --r-ctl:14px; --r-panel:22px; --r-pill:999px;
  --tap:44px; --dock-h:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:#07080B;color:var(--t1);font-family:var(--f-ui);font-size:var(--fs-body);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input{font:inherit;color:inherit}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}

/* ---------- 原型舞台 ---------- */
.proto{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:16px}
.proto-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;max-width:932px}
.proto-name{width:100%;text-align:center;font-size:var(--fs-sm);color:var(--t3);letter-spacing:.04em}
.proto-name b{color:var(--t1);font-size:var(--fs-md);letter-spacing:.08em;margin-right:8px}
.pseg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-ctl)}
.pseg button{min-height:40px;padding:0 14px;border-radius:10px;color:var(--t2);font-size:var(--fs-sm)}
.pseg button.on{background:var(--s3);color:var(--t1)}
.proto select{min-height:48px;padding:0 12px;background:var(--s1);color:var(--t1);border:1px solid var(--line);border-radius:var(--r-ctl);font:inherit;font-size:var(--fs-sm)}
.notes{width:min(430px,100%);font-size:var(--fs-sm);color:var(--t2);display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{display:flex;gap:10px}.notes li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--amber);margin-top:8px;flex:none}

/* ---------- 设备框 ---------- */
.device{position:relative;width:min(430px,100%);height:880px;max-height:calc(100dvh - 150px);min-height:640px;background:var(--bg);
  border-radius:40px;overflow:hidden;isolation:isolate;container-type:inline-size;
  box-shadow:0 0 0 1px var(--line),0 0 0 9px #030305,0 30px 80px rgba(0,0,0,.55);
  --sat:34px;--sab:16px;--sal:0px}
.device.land{width:min(932px,100%);height:auto;aspect-ratio:932/430;min-height:0;max-height:none;--sat:0px;--sab:0px;--sal:34px;border-radius:32px}
@media (max-width:520px){.device:not(.land){border-radius:0;box-shadow:none;width:calc(100% + 32px);margin-inline:-16px;max-height:none;height:calc(100dvh - 120px)}}
.sbar{position:absolute;inset:0 0 auto;height:var(--sat);display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0;
  font-size:var(--fs-sm);font-weight:600;font-variant-numeric:tabular-nums;background:var(--bg);z-index:30;pointer-events:none}
.device.land .sbar{display:none}
.device.on-player .sbar{background:#000}
#content{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;
  padding-top:var(--sat);padding-bottom:calc(var(--dock-h) + var(--sab) + 28px)}
#content::-webkit-scrollbar{display:none}
.device.no-dock #content{padding-bottom:calc(var(--sab) + 24px)}
.device.with-cta #content{padding-bottom:calc(var(--sab) + 104px)}
.device.on-player #content{padding:0;overflow:hidden;background:#000}
.device.on-player:not(.land) #content{padding-top:var(--sat);overflow-y:auto}
.pad{padding-inline:var(--sp4)}

/* ---------- 底栏 #nav：3 个去向 + 拇指区搜索 ---------- */
#nav{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 8px);height:var(--dock-h);display:flex;align-items:center;gap:4px;padding:6px;
  background:rgba(21,22,28,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--r-panel);z-index:20}
.tab{flex:1;min-width:0;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t3);font-size:var(--fs-sm);border-radius:16px}
.tab.on{color:var(--t1)}.tab.on .i{color:var(--amber)}
.dock-search{height:52px;padding:0 18px;border-radius:16px;background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex:none}
.dock-search .i{stroke-width:2.2}

/* ---------- 通用部件 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;min-height:60px}
.brand{display:flex;align-items:center;gap:8px}
.brand .i{width:18px;height:18px;color:var(--amber)}
.brand b{font-size:22px;font-weight:800;letter-spacing:.12em}
.status-chip{min-height:var(--tap);padding:0 14px;border-radius:var(--r-pill);background:var(--s2);font-size:var(--fs-sm);color:var(--t2);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t3);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.live{background:var(--live)}.dot.bad{background:var(--bad)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 0 12px}
.sec-h h2{margin:0;font-size:var(--fs-lg);font-weight:700;line-height:1.3}
.sub{margin:2px 0 0;font-size:var(--fs-sm);color:var(--t3);font-variant-numeric:tabular-nums}
.link{min-height:var(--tap);padding:0 4px;color:var(--t2);font-size:var(--fs-body);display:flex;align-items:center;gap:2px}
.link .i{width:18px;height:18px}
.h1{font-size:var(--fs-xl);font-weight:800;margin:0;letter-spacing:.02em}
.seg{display:flex;padding:3px;background:var(--s2);border-radius:12px;flex:none}
.seg button{min-height:38px;padding:0 12px;border-radius:9px;font-size:var(--fs-sm);color:var(--t2)}
.seg button.on{background:var(--t1);color:var(--bg);font-weight:600}
.btn{min-height:48px;padding:0 18px;border-radius:var(--r-ctl);background:var(--s2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--amber);color:var(--amber-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--t2)}
.btn .i{width:20px;height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center}
.icon-btn.glass{background:rgba(12,13,17,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* 分类粘顶 */
.cats{position:sticky;top:var(--sat);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px var(--sp4);margin-top:12px;border-bottom:1px solid var(--line)}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:var(--tap);padding:0 16px;border-radius:var(--r-pill);background:var(--s2);color:var(--t2);font-size:var(--fs-body);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--t1);color:var(--bg);font-weight:600}
.chip small{font-size:var(--fs-cap);opacity:.7}

/* 继续看 */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1 * var(--sp4));padding-inline:var(--sp4);scroll-padding-inline:var(--sp4)}
.rail::-webkit-scrollbar{display:none}
.cw{flex:0 0 236px;scroll-snap-align:start;display:grid;gap:8px}
.cw .still{aspect-ratio:16/9;border-radius:12px}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.45)}
.prog i{display:block;height:100%;background:var(--amber)}
.cw-play{position:absolute;right:8px;bottom:12px;width:36px;height:36px;border-radius:50%;background:rgba(12,13,17,.72);display:grid;place-items:center;color:var(--t1)}
.cw-play .i{width:16px;height:16px}
.cw b,.card b{display:block;font-size:var(--fs-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw span,.card span.meta{display:block;font-size:var(--fs-sm);color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 海报（演示用几何占位，真实版换 <img>） */
.poster,.still{position:relative;overflow:hidden;container-type:inline-size;
  --pb:hsl(var(--h) 30% 19%);--ps:hsl(var(--h) 40% 36%);--pa:hsl(calc(var(--h) + 35) 60% 64%);background:var(--pb)}
.poster{aspect-ratio:2/3;border-radius:var(--r-poster);max-width:100%}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-shape,.p-shape2{position:absolute;display:block}
.c0 .p-shape{width:52%;aspect-ratio:1;border-radius:50%;background:var(--pa);top:16%;left:12%}
.c0 .p-shape2{left:0;right:0;bottom:0;height:38%;background:var(--ps)}
.c1 .p-shape{top:0;bottom:0;left:16%;width:24%;background:var(--ps)}
.c1 .p-shape2{top:0;bottom:0;left:50%;width:8%;background:var(--pa)}
.c2 .p-shape{right:-24%;bottom:-12%;width:92%;aspect-ratio:1;border-radius:50%;border:9cqw solid var(--ps)}
.c2 .p-shape2{left:14%;top:14%;width:16%;aspect-ratio:1;background:var(--pa);transform:rotate(45deg)}
.p-title{position:absolute;right:9%;top:8%;writing-mode:vertical-rl;font-weight:800;font-size:13cqw;letter-spacing:.18em;color:hsl(var(--h) 30% 93%)}
.still .p-title{display:none}
.score{position:absolute;left:6px;bottom:6px;padding:2px 6px;border-radius:var(--r-badge);background:rgba(10,10,13,.78);font-size:var(--fs-cap);font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 片单 .grid / .card */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}
@container (max-width:350px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:grid;gap:8px;min-width:0}
.card .poster{transition:transform .15s}
.card:active .poster{transform:scale(.97)}

/* 横幅：缓存陈旧等 */
.banner{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:var(--r-ctl);background:rgba(255,155,94,.1);border:1px solid rgba(255,155,94,.28);margin-top:4px}
.banner .i{color:var(--warn)}
.banner p{margin:0;flex:1;font-size:var(--fs-sm);color:var(--t1)}
.banner p small{display:block;color:var(--t2)}
.banner .btn{min-height:var(--tap);padding:0 14px;background:var(--warn);color:#2A1206;font-size:var(--fs-sm)}

/* 骨架屏 */
.sk{background:var(--s2);border-radius:10px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sk,.bar-run i,.eq i{animation:none!important}*{transition:none!important}}

/* 空状态 */
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:32px 16px;border-radius:var(--r-panel);background:var(--s1);border:1px solid var(--line)}
.empty .i{width:32px;height:32px;color:var(--t3)}
.empty b{font-size:var(--fs-md)}
.empty p{margin:0;color:var(--t2);max-width:30em}
.tips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tips span{padding:6px 10px;border-radius:var(--r-pill);background:var(--s2);font-size:var(--fs-sm);color:var(--t2)}

/* ---------- 搜索层 ---------- */
.search-layer{position:absolute;inset:0;z-index:40;background:var(--bg);padding-top:var(--sat);display:flex;flex-direction:column}
.s-head{display:flex;gap:8px;align-items:center;padding-block:10px}
.field{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:var(--r-ctl);background:var(--s2);border:1px solid transparent}
.field:focus-within{border-color:var(--amber)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:var(--fs-md)}
.field input::placeholder{color:var(--t3)}
.field .i{color:var(--t3)}
#sres{flex:1;overflow-y:auto;padding-bottom:24px}
.s-label{font-size:var(--fs-sm);color:var(--t3);margin:16px 0 8px}
.hits{display:grid;gap:2px}
.hit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;min-height:72px;padding:6px 8px;margin-inline:-8px;border-radius:12px}
.hit:active{background:var(--s2)}
.hit .poster{width:44px;border-radius:6px}
.hit b{font-size:var(--fs-md);font-weight:600}
.hit b mark{background:none;color:var(--amber)}
.hit small{display:block;color:var(--t3);font-size:var(--fs-sm)}
.why{font-size:var(--fs-cap);color:var(--t2);padding:3px 8px;border-radius:var(--r-badge);background:var(--s2);white-space:nowrap}
.net-row{display:flex;align-items:center;gap:12px;min-height:56px;margin-top:8px;padding:0 14px;border-radius:var(--r-ctl);border:1px dashed var(--line);color:var(--t2);width:100%}
.net-row b{color:var(--t1);font-weight:600}
.net-row .i:last-child{margin-left:auto}

/* ---------- 详情 / 选集 ---------- */
.dtop{position:absolute;top:calc(var(--sat) + 8px);left:12px;z-index:10}
.dhead{position:relative;padding-top:64px}
.band{position:absolute;inset:0 0 auto;height:176px;background:hsl(var(--h) 26% 15%)}
.dhead-in{position:relative;display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:end}
.dhead-in .poster{box-shadow:0 12px 30px rgba(0,0,0,.45)}
.dmeta h1{margin:0;font-size:var(--fs-xl);line-height:1.2;font-weight:800;text-wrap:balance}
.alias{margin:4px 0 0;color:var(--t3);font-size:var(--fs-sm)}
.facts{margin:6px 0 0;color:var(--t2);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.ratings{display:flex;gap:20px;margin-top:12px}
.ratings div{display:grid}
.ratings b{font-size:var(--fs-lg);font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.1}
.ratings b.na{color:var(--t3)}
.ratings span{font-size:var(--fs-cap);color:var(--t3);letter-spacing:.04em}
.desc{margin:16px 0 0;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{display:block}
.more{min-height:var(--tap);color:var(--t1);font-size:var(--fs-sm);padding-inline:var(--sp4)}

.sources{display:grid;gap:8px}
.source-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:60px;padding:8px 14px;border-radius:var(--r-ctl);background:var(--s1);border:1px solid var(--line);width:100%}
.source-row.on{border-color:var(--amber);background:var(--amber-soft)}
.source-row[disabled]{opacity:.55;cursor:default}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--t3);display:grid;place-items:center}
.source-row.on .radio{border-color:var(--amber)}
.source-row.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--amber)}
.sr-main b{display:block;font-weight:600}
.sr-main small{color:var(--t3);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.tag-fast{font-size:var(--fs-cap);color:var(--ok);border:1px solid rgba(98,210,155,.4);padding:1px 6px;border-radius:var(--r-badge);margin-left:6px;font-weight:600}
.sr-speed{display:grid;justify-items:end;gap:4px;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;color:var(--t2)}
.sr-speed .bad{color:var(--bad)}
.bars{display:flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:4px;border-radius:1px;background:var(--s3)}
.bars i.on{background:var(--ok)}
.bar-run{width:56px;height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.bar-run i{display:block;width:40%;height:100%;background:var(--t2);animation:run 1s linear infinite}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.hint{font-size:var(--fs-sm);color:var(--t3);margin:8px 0 0}

.ranges{display:flex;gap:8px;margin-bottom:12px}
.episodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@container (max-width:350px){.episodes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ep{position:relative;min-height:48px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.ep.seen{color:var(--t3);background:var(--s1)}
.ep.cur{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber)}
.ep.cur::after{content:"看到这";position:absolute;top:-8px;right:-4px;font-size:10px;line-height:1;padding:3px 4px;border-radius:5px;background:var(--amber);color:var(--amber-ink);font-weight:700}
.ep.wide{grid-column:span 2}
.cta-bar{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:12px var(--sp4) calc(var(--sab) + 12px);background:var(--bg);border-top:1px solid var(--line)}
.cta{width:100%;min-height:54px;border-radius:var(--r-ctl);background:var(--amber);color:var(--amber-ink);font-size:var(--fs-md);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.cta small{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.cta[disabled]{background:var(--s2);color:var(--t3);cursor:default}

/* ---------- 播放器 #player / #video ---------- */
#player{position:relative;background:#000;overflow:hidden;user-select:none}
#player.land{position:absolute;inset:0}
#player.port{aspect-ratio:16/9;width:100%}
.scene{position:absolute;inset:0;background:hsl(var(--h) 34% 11%)}
.scene .moon{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;background:hsl(calc(var(--h) + 35) 55% 70%);top:16%;right:22%}
.scene .hill{position:absolute;left:-10%;right:30%;bottom:0;height:42%;background:hsl(var(--h) 30% 20%);border-radius:50% 50% 0 0}
.scene .hill2{position:absolute;left:35%;right:-15%;bottom:0;height:30%;background:hsl(var(--h) 28% 15%);border-radius:50% 50% 0 0}
.scene .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:var(--fs-sm);letter-spacing:.3em;color:rgba(255,255,255,.18)}
.tapzone{position:absolute;inset:0}
.pc{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;transition:opacity .2s;

 return top+banner+`<section class="pad"><div class="sec-h" style="margin-top:12px"><h2>继续看</h2><button class="link" data-a="go:rec">全部记录${ic('chev')}</button></div><div class="rail">${cw}</div></section>
 <nav class="cats" aria-label="分类">${CATS.map(c=>`<button class="chip ${c===S.cat?'on':''}" data-a="cat:${c}">${c}</button>`).join('')}</nav>
 <section class="pad"><div class="sec-h"><div><h2>${S.cat==='推荐'?'高分片单':S.cat}</h2><p class="sub">本地片单 · ${stale?'2026-09-14 更新':'10月18日更新'}</p></div>
  <div class="seg" role="tablist"><button class="${S.rank==='db'?'on':''}" data-a="rank:db">豆瓣</button><button class="${S.rank==='rt'?'on':''}" data-a="rank:rt">烂番茄</button></div></div>
  ${grid}</section>`;
}

/* ---------- 搜索层 ---------- */
function match(q){
 const n=q.trim().toLowerCase(); if(!n) return [];
 const out=[];
 for(const f of F){
  let why=null;
  if(f.t.includes(q.trim())) why='片名';
  else { const al=f.a.find(a=>a.toLowerCase().includes(n)); if(al) why='别名 · '+al;
   else if(f.id.startsWith(n)) why='拼音首字母';
   else { let i=0; for(const ch of f.t) if(ch===q.trim()[i]) i++; if(i>=2&&i===q.trim().length) why='相近'; } }
  if(why) out.push({f,why});
 }
 return out;
}
function hl(t,q){const i=t.indexOf(q.trim());return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+q.trim().length)+'</mark>'+t.slice(i+q.trim().length)}
function searchBody(){
 const q=S.search.q, ph=S.search.phase;
 if(!q.trim()) return `<p class="s-label">最近搜索</p><div class="row">${['深蓝时刻','昨日来信','银河'].map(x=>`<button class="chip" data-a="sq:${x}">${x}</button>`).join('')}</div>
  <p class="s-label">支持片名、别名、英文名和拼音首字母，例如 zrlx</p>`;
 if(ph==='searching') return `<p class="s-label">正在搜索 3 个来源…</p><div class="hits">${SRC.map(s=>`<div class="hit" style="grid-template-columns:1fr auto"><b style="font-size:14px">${s.n}</b><span class="bar-run"><i></i></span></div>`).join('')}</div>`;
 const m=match(q);
 if(ph==='done'&&!m.length) return `<div class="empty" style="margin-top:16px">${ic('search')}<b>没有找到“${esc(q)}”</b><p>本地片单和 3 个来源都没有结果。片名可能写法不同，或者来源里暂时没有这部。</p>
  <div class="tips"><span>去掉“第二季”等字样</span><span>换英文名</span><span>换别名</span></div>
  <div class="row" style="justify-content:center"><button class="btn" data-a="sq:">清空重输</button><button class="btn primary" data-a="go-search">${ic('refresh')}再搜一次</button></div></div>`;
 const rows=m.map(({f,why})=>`<button class="hit" data-a="film:${f.id}">${poster(f)}<span style="min-width:0"><b>${hl(f.t,q)}</b><small>${f.r} · ${f.y}${f.k==='tv'?' · '+f.eps+' 集':''}</small></span><span class="why">${esc(why)}</span></button>`).join('');
 return `${m.length?`<p class="s-label">${ph==='done'?'来源结果':'本地片单匹配'}</p><div class="hits">${rows}</div>`:`<p class="s-label">本地片单里没有匹配项</p>`}
  ${ph==='done'?'':`<button class="net-row" data-a="go-search">${ic('globe')}<span>在 3 个来源中搜索 <b>“${esc(q)}”</b></span>${ic('chev')}</button>`}`;
}
function searchLayer(){
 return `<div class="search-layer"><div class="s-head pad"><button class="icon-btn" data-a="search-close" aria-label="返回">${ic('back')}</button>
  <label class="field">${ic('search')}<input id="q" value="${esc(S.search.q)}" placeholder="片名、别名或拼音首字母" enterkeyhint="search" autocomplete="off"></label></div>
  <div id="sres" class="pad">${searchBody()}</div></div>`;
}

/* ---------- 详情 / 选集 ---------- */
function detail(){
 const f=byId(S.film), nosrc=S.state==='nosrc', pr=PROG[f.id], cur=pr?pr.ep:null;
 const alias=f.a.length?`<p class="alias">又名 ${f.a.join(' / ')}</p>`:'';
 let srcHtml;
 if(nosrc){
  srcHtml=`<div class="empty">${ic('signal')}<b>暂时没有能播放的来源</b><p>已在 3 个来源中搜索“${f.t}”：2 个没有这部，1 个连接超时。</p>
   <div class="row" style="justify-content:center"><button class="btn" data-a="retest">${ic('refresh')}重新测速</button><button class="btn primary" data-a="alias-search">用别名“${f.a[0]||f.t}”搜索</button></div></div>`;
 } else {
  srcHtml=`<div class="sources">${SRC.map((s,i)=>{
   const done=!S.testing||i<S.tested, bad=s.sp==null;
   const sp=!done?`<span class="bar-run"><i></i></span><span>测速中</span>`:bad?`<span class="bad">超时</span>`
    :`<span>${s.sp} MB/s</span><span class="bars">${[1,2,3,4].map(k=>`<i class="${s.sp>=k*0.6?'on':''}" style="height:${k*3}px"></i>`).join('')}</span>`;
   return `<button class="source-row ${S.src===i?'on':''}" data-a="src:${i}" ${done&&bad?'disabled':''}><span class="radio"></span>
    <span class="sr-main"><b>${s.n}${done&&i===0?'<span class="tag-fast">最快</span>':''}</b><small>${f.k==='tv'?(i===1?f.eps-2:f.eps)+' 集':'正片'}${done&&!bad?' · '+s.ms+' ms':''}</small></span>
    <span class="sr-speed">${sp}</span></button>`}).join('')}</div>
   <p class="hint">${S.testing?'逐个测速中，开始播放会停止测速。':'已自动选中最快的来源 1。来源 3 超时，已跳过。'}</p>`;
 }
 let eps='';
 if(!nosrc){
  if(f.k==='movie') eps=`<div class="episodes"><button class="ep wide ${cur?'cur':''}" data-a="play:${f.id}:1">正片</button></div>`;
  else {
   const N=f.eps, ranges=[]; for(let s=1;s<=N;s+=30) ranges.push([s,Math.min(N,s+29)]);
   const [a,b]=ranges[Math.min(S.range,ranges.length-1)];
   eps=(ranges.length>1?`<div class="ranges">${ranges.map((r,i)=>`<button class="chip ${i===S.range?'on':''}" data-a="range:${i}">${r[0]}–${r[1]}</button>`).join('')}</div>`:'')+
   `<div class="episodes">${Array.from({length:b-a+1},(_,k)=>{const n=a+k;return `<button class="ep ${cur&&n<cur?'seen':''} ${n===cur?'cur':''}" data-a="play:${f.id}:${n}">${n}</button>`}).join('')}</div>`;
  }
 }
 const cta=nosrc?`<button class="cta" disabled>暂无可播放来源</button>`
  :f.k==='movie'?`<button class="cta" data-a="play:${f.id}:1">${ic('play')}${cur?'继续播放 <small>1:12:04</small>':'播放正片'}</button>`
  :`<button class="cta" data-a="play:${f.id}:${cur||1}">${ic('play')}${cur?`继续 第 ${cur} 集 <small>${fmt(pr.t)}</small>`:'播放 第 1 集'}</button>`;
 return `<div class="dtop"><button class="icon-btn glass" data-a="back" aria-label="返回">${ic('back')}</button></div>
 <header class="dhead" style="--h:${f.h}"><div class="band"></div><div class="dhead-in pad">${poster(f)}
  <div class="dmeta"><h1>${f.t}</h1>${alias}<p class="facts">${f.y} · ${f.r}${f.k==='tv'?' · 共 '+f.eps+' 集':''}</p>
  <div class="ratings"><div><b>${f.db}</b><span>豆瓣</span></div><div><b class="${f.rt?'':'na'}">${f.rt?f.rt+'%':'—'}</b><span>烂番茄</span></div></div></div></div></header>
 <p class="desc pad ${S.descOpen?'open':''}">${f.d}</p><button class="more" data-a="desc">${S.descOpen?'收起':'展开简介'}</button>
 <section class="pad"><div class="sec-h" style="margin-top:12px"><h2>播放来源</h2>${nosrc?'':`<button class="link" data-a="retest">${ic('refresh')}重新测速</button>`}</div>${srcHtml}</section>
 ${eps?`<section class="pad"><div class="sec-h"><h2>${f.k==='tv'?'选集':'播放'}</h2><span class="sub">${f.k==='tv'?'共 '+f.eps+' 集':''}</span></div>${eps}</section>`:''}
 <div class="cta-bar">${cta}</div>`;
}

/* ---------- 播放器 ---------- */
function panelHtml(){

 if(S.panel==='speed'){title='倍速';body=[0.5,0.75,1,1.25,1.5,2].map(v=>`<button class="opt ${S.speed===v?'on':''}" data-a="speed:${v}">${v===1?'1.0× 正常':v+'×'}${S.speed===v?ic('check'):''}</button>`).join('');}
 if(S.panel==='eps'){title='选集';body=f.k==='movie'?`<button class="opt on">正片</button>`:`<div class="episodes">${Array.from({length:Math.min(f.eps,30)},(_,k)=>`<button class="ep ${k+1===S.ep?'cur':''}" data-a="play:${f.id}:${k+1}">${k+1}</button>`).join('')}</div>`;}
 if(S.panel==='src'){title='换来源';body=SRC.map((s,i)=>`<button class="opt ${S.src===i?'on':''}" data-a="psrc:${i}" ${s.sp==null?'disabled style="opacity:.5"':''}><span>${s.n}</span><span>${s.sp==null?'超时':s.sp+' MB/s'}</span></button>`).join('');}

 const l=CH.map((c,i)=>({c,i})).filter(({c})=>(S.live.g==='全部'||c.g===S.live.g)&&(!S.live.hd||c.hd)&&(!q||(c.n+c.s).toLowerCase().includes(q)));

 overlay.innerHTML=(S.search.open?searchLayer():'')+(sc==='player'&&S.panel&&S.orient!=='land'?panelHtml():'');
 if(keepScroll) content.scrollTop=y; else content.scrollTop=0;
 document.querySelectorAll('#pscreens button').forEach(b=>b.classList.toggle('on',b.dataset.s===(sc==='detail'?'detail':sc)));
 document.getElementById('porient').hidden=sc!=='player';
 document.querySelectorAll('#porient button').forEach(b=>b.classList.toggle('on',b.dataset.o===S.orient));
 document.getElementById('notes').innerHTML=NOTES[sc].map(n=>`<li>${n}</li>`).join('');
 document.getElementById('notes').style.width=dev.classList.contains('land')?'min(932px,100%)':'';
 bumpHide();
}
function go(screen){ if(S.screen!==screen){S.stack.push(S.screen);} S.screen=screen; S.panel=null; render(); }
function back(){ S.panel=null; S.screen=S.stack.pop()||'home'; if(S.screen==='player')S.screen='home'; render(); }

/* 控件自动隐藏 */
let hideT;
function updCtrl(){const pc=document.querySelector('.pc'),mp=document.querySelector('.mini-prog');if(pc)pc.classList.toggle('hide',!S.ctrl);if(mp)mp.hidden=S.ctrl}
function bumpHide(){clearTimeout(hideT);if(S.screen==='player'&&S.playing&&!S.panel&&S.state!=='stall')hideT=setTimeout(()=>{S.ctrl=false;updCtrl()},3000)}
function tip(t){const el=document.getElementById('seektip');if(!el)return;el.textContent=t;el.hidden=false;clearTimeout(tip.t);tip.t=setTimeout(()=>el.hidden=true,700)}
function tickUI(){const D=dur(),p=(S.t/D*100).toFixed(2)+'%',r=document.getElementById('prange'),tm=document.getElementById('ptime'),mi=document.getElementById('pmini');
 if(tm)tm.textContent=fmt(S.t); if(r&&!dragging){r.value=Math.floor(S.t);r.style.setProperty('--p',p)} if(mi)mi.style.width=p}
let lastTap=0,tapT;
function tapZone(e){
 const pl=document.getElementById('player'); if(!pl)return;
 const r=pl.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, now=Date.now();
 if(now-lastTap<280&&(x<.35||x>.65)){clearTimeout(tapT);lastTap=0;const d=x<.5?-10:10;S.t=Math.min(dur(),Math.max(0,S.t+d));tickUI();tip(d<0?'−10 秒':'+10 秒');return}
 lastTap=now; clearTimeout(tapT); tapT=setTimeout(()=>{S.ctrl=!S.ctrl;updCtrl();bumpHide()},280);
}

/* 事件 */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');
 if(!el){ if(e.target.closest('[data-tz]')) tapZone(e); return; }
 if(!el.closest('#device')) return;
 const [a,...rest]=el.dataset.a.split(':'), v=rest.join(':');
 switch(a){
  case 'noop': return;
  case 'go': S.search.open=false; if(['home','live','rec'].includes(v)){S.stack=[];S.screen=v;S.panel=null;render()} break;
  case 'film': S.film=v; S.range=0; S.descOpen=false; S.search.open=false; if(S.state!=='nosrc')S.src=0; S.testing=true; S.tested=0; go('detail'); runTest(); break;
  case 'play': { const [id,ep]=v.split(':'); S.film=id; S.ep=+ep; S.t=PROG[id]&&PROG[id].ep===+ep?PROG[id].t:0; S.playing=true; S.ctrl=true; S.panel=null; S.search.open=false; if(S.state==='nosrc')S.state='normal'; go('player'); break; }
  case 'back': back(); break;
  case 'cat': S.cat=v; render(true); break;
  case 'rank': S.rank=v; render(true); break;
  case 'search-open': S.search={open:true,q:S.state==='empty'?'海边那年':'',phase:S.state==='empty'?'done':'idle'}; render(true); setTimeout(()=>document.getElementById('q')?.focus(),50); break;
  case 'search-close': S.search.open=false; render(true); break;
  case 'sq': S.search.q=v; S.search.phase='idle'; document.getElementById('q').value=v; document.getElementById('sres').innerHTML=searchBody(); break;
  case 'go-search': doSearch(); break;
  case 'alias-search': { const f=byId(S.film); S.state='normal'; syncState(); S.search={open:true,q:f.a[0]||f.t,phase:'idle'}; render(true); doSearch(); break; }
  case 'src': S.src=+v; render(true); break;
  case 'psrc': S.src=+v; S.panel=null; if(S.state==='stall'){S.state='normal';syncState()} render(true); tip('已切换到'+SRC[+v].n); break;
  case 'retest': if(S.state==='nosrc'){S.state='normal';syncState()} S.testing=true; S.tested=0; render(true); runTest(); break;
  case 'range': S.range=+v; render(true); break;
  case 'desc': S.descOpen=!S.descOpen; render(true); break;
  case 'pp': S.playing=!S.playing; S.ctrl=true; render(true); break;
  case 'seek': S.t=Math.min(dur(),Math.max(0,S.t+ +v)); tickUI(); tip(+v<0?'−10 秒':'+10 秒'); bumpHide(); break;
  case 'panel': S.panel=v||null; S.ctrl=true; render(true); break;
  case 'speed': S.speed=+v; S.panel=null; render(true); tip(v+'× 倍速'); break;
  case 'orient': S.orient=S.orient==='land'?'port':'land'; S.panel=null; render(); break;
  case 'retry': S.state='normal'; syncState(); render(true); break;
  case 'ch': S.live.ch=+v; S.live.line=0; if(S.state==='stall-live'){S.state='normal';syncState()} render(true); break;
  case 'line': S.live.line=+v; if(S.state==='stall-live'){S.state='normal';syncState()} render(true); break;
  case 'grp': S.live.g=v; render(true); break;
  case 'hd': S.live.hd=!S.live.hd; render(true); break;
  case 'refresh-cache': S.state='normal'; syncState(); render(true); break;
 }
});
let dragging=false;
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.search.q=e.target.value;S.search.phase='idle';document.getElementById('sres').innerHTML=searchBody()}
 if(e.target.id==='lq'){S.live.q=e.target.value;document.getElementById('livelist').innerHTML=liveList()}
 if(e.target.id==='prange'){dragging=true;const v=+e.target.value,d=v-S.t;e.target.style.setProperty('--p',(v/dur()*100)+'%');document.getElementById('ptime').textContent=fmt(v);
  const el=document.getElementById('seektip');el.hidden=false;el.textContent=(d<0?'−':'+')+fmt(Math.abs(d))+'  →  '+fmt(v);clearTimeout(hideT)}
});
document.addEventListener('change',e=>{if(e.target.id==='prange'){S.t=+e.target.value;dragging=false;document.getElementById('seektip').hidden=true;bumpHide()}});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'){e.preventDefault();doSearch()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.screen==='player'&&S.playing){S.playing=false;S.ctrl=true;render(true)}});

function doSearch(){ if(!S.search.q.trim())return; S.search.phase='searching'; document.getElementById('sres').innerHTML=searchBody(); setTimeout(()=>{S.search.phase='done'; if(S.search.open)document.getElementById('sres').innerHTML=searchBody()},900); }
function runTest(){ const step=()=>{ if(!S.testing)return; S.tested++; if(S.tested>=3)S.testing=false; if(S.screen==='detail')render(true); if(S.testing)setTimeout(step,550)}; setTimeout(step,550); }
setInterval(()=>{ if(S.screen==='player'&&S.playing&&S.state!=='stall'&&!dragging){ S.t=Math.min(dur(),S.t+S.speed); tickUI(); } },1000);

/* ---------- 原型控制条 ---------- */
const SCREENS=[['home','首页'],['detail','详情·选集'],['player','播放器'],['live','直播'],['rec','记录']];
document.getElementById('pscreens').innerHTML=SCREENS.map(([k,n])=>`<button data-s="${k}">${n}</button>`).join('');
document.getElementById('pscreens').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.s;
 S.search.open=false;S.panel=null;S.stack=k==='detail'||k==='player'?['home']:[];
 if(k==='detail'){S.film=S.film||'zrlx';S.testing=false;S.tested=3} if(k==='player'){S.ctrl=true;S.playing=true}
 S.screen=k;render()});
document.getElementById('porient').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.orient=b.dataset.o;S.panel=null;render()});
const stateSel=document.getElementById('pstate');
function syncState(){stateSel.value=S.state}
stateSel.addEventListener('change',()=>{
 S.state=stateSel.value; S.search.open=false; S.panel=null; S.ctrl=true;
 if(S.state==='loading'||S.state==='stale'){S.stack=[];S.screen='home'}
 if(S.state==='empty'){S.stack=[];S.screen='home';S.search={open:true,q:'海边那年',phase:'done'}}
 if(S.state==='nosrc'){S.stack=['home'];S.film='shjz';S.testing=false;S.screen='detail'}
 if(S.state==='stall'){S.stack=['home'];S.screen='player';S.playing=true}
 if(S.state==='stall-live'){S.stack=[];S.screen='live'}
 render();
});
render();
</script>
